[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 未使用 import・未定義名・重複定義など「壊れている」ものだけを見る。
# スタイルの強制はしない（既存コードを大量に書き換えないため）。
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 実行に時間がかかるテスト（clone + 学習など）"]

[project]
name = "ds-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2",
    # 以下は main のコードに import が無いが、コンペで実際に使うため残す
    # （前コンペでの使用実績: shap 67 ファイル / pytabkit 8 / flaml 2）。
    # pyarrow は pandas の parquet エンジンとして必要。
    "flaml[automl]>=2.5.0",
    "japanize-matplotlib>=1.1.3",
    "kaggle>=1.6",
    "lightgbm>=4.6.0",
    "marimo>=0.20.4",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    # numba は shap の推移的依存だが、uv のユニバーサル解決では x86_64 darwin 分岐の上限制約に
    # 引きずられて numba==0.53.1 / llvmlite==0.36.0（Python 3.9 まで）が選ばれ uv sync が失敗する。
    # 直接依存として下限を明示することで回避する（">=0.53.1" のような自明下限では効果がない）。
    "numba>=0.60",
    "numpy>=2.4.2",
    "optuna>=4.0",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytabkit>=1.7.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.46",
    "torch>=2.11.0",
    "xgboost>=2.1",
]
